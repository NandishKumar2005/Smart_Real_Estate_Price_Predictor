{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<style>
    #heatmap-container {
        height: 500px;
        border-radius: 12px;
        width: 100%;
        margin-top: 1rem;
    }
    .legend {
        background: rgba(15, 23, 42, 0.9);
        padding: 10px 14px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 0.85rem;
        margin: 8px;
    }
    .legend-dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row align-items-center mb-4 fade-in-up">
        <div class="col-12 text-center text-md-start">
            <h2 class="display-6 fw-bold mb-2">
                <span class="text-gradient"><i class="fa-solid fa-map-location-dot me-3"></i>Real Estate Price Heatmap</span>
            </h2>
            <p class="text-muted">Explore property valuations across different areas. Bubble size and color indicate relative affordability.</p>
        </div>
    </div>
    <div class="row fade-in-up delay-1">
        <div class="col-12">
            <div class="glass-card p-2 p-md-4">
                <div id="heatmap-container"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let map;

    async function initMap() {
        const { Map } = await google.maps.importLibrary("maps");
        const { Circle, InfoWindow } = await google.maps.importLibrary("maps");

        map = new Map(document.getElementById('heatmap-container'), {
            center: { lat: 15.5, lng: 80.0 },
            zoom: 5,
            mapId: 'DEMO_MAP_ID',
            mapTypeControl: false,
            streetViewControl: false,
            fullscreenControl: true,
        });

        // Legend control
        const legend = document.createElement('div');
        legend.className = 'legend';
        legend.innerHTML = `
            <strong style="display:block;margin-bottom:6px;">Pricing Legend</strong>
            <div><span class="legend-dot" style="background:#22c55e"></span> Affordable (&lt;75L)</div>
            <div><span class="legend-dot" style="background:#f97316"></span> Moderate (75L–1.25Cr)</div>
            <div><span class="legend-dot" style="background:#ef4444"></span> Expensive (&gt;1.25Cr)</div>
        `;
        map.controls[google.maps.ControlPosition.BOTTOM_RIGHT].push(legend);

        try {
            const response = await fetch('/api/price-heatmap');
            const locations = await response.json();
            const infoWindow = new google.maps.InfoWindow();
            const bounds = new google.maps.LatLngBounds();

            locations.forEach(loc => {
                let color, radius;
                if (loc.price < 7500000) {
                    color = '#22c55e'; radius = Math.max(3000, Math.min(15000, loc.price / 10000));
                } else if (loc.price <= 12500000) {
                    color = '#f97316'; radius = Math.max(3000, Math.min(15000, loc.price / 8000));
                } else {
                    color = '#ef4444'; radius = Math.max(3000, Math.min(15000, loc.price / 6000));
                }

                const circle = new google.maps.Circle({
                    map,
                    center: { lat: loc.lat, lng: loc.lng },
                    radius,
                    strokeColor: color,
                    strokeOpacity: 0.8,
                    strokeWeight: 1,
                    fillColor: color,
                    fillOpacity: 0.45,
                });

                circle.addListener('click', () => {
                    infoWindow.setContent(`
                        <div style="color:#0f172a;padding:4px">
                            <strong>${loc.location}</strong><br>
                            Avg Price: <strong>${new Intl.NumberFormat('en-IN', {style:'currency',currency:'INR',maximumFractionDigits:0}).format(loc.price)}</strong>
                        </div>
                    `);
                    infoWindow.setPosition({ lat: loc.lat, lng: loc.lng });
                    infoWindow.open(map);
                });

                bounds.extend({ lat: loc.lat, lng: loc.lng });
            });

            if (locations.length > 0) map.fitBounds(bounds);
        } catch (err) {
            console.error('Error loading heatmap data:', err);
        }
    }
</script>
<script async
    src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&loading=async&callback=initMap">
</script>
{% endblock %}
