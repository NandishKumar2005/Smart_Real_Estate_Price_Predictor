{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<style>
    #heatmap-container {
        height: 500px;
        border-radius: 12px;
        width: 100%;
        margin-top: 1rem;
    }
    .legend {
        background: rgba(15, 23, 42, 0.9);
        padding: 10px 14px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 0.85rem;
        margin: 8px;
    }
    .legend-dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row align-items-center mb-4 fade-in-up">
        <div class="col-12 text-center text-md-start">
            <h2 class="display-6 fw-bold mb-2">
                <span class="text-gradient"><i class="fa-solid fa-map-location-dot me-3"></i>Real Estate Price Heatmap</span>
            </h2>
            <p class="text-muted">Explore property valuations across different areas. Bubble size and color indicate relative affordability.</p>
        </div>
    </div>
    <div class="row fade-in-up delay-1">
        <div class="col-12">
            <div class="glass-card p-2 p-md-4">
                <div id="heatmap-container"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let map;

    function initMap() {
        map = new google.maps.Map(document.getElementById('heatmap-container'), {
            center: { lat: 20.5, lng: 79.0 },
            zoom: 5,
            mapTypeControl: false,
            streetViewControl: false,
            fullscreenControl: true,
        });

        // Legend
        const legend = document.createElement('div');
        legend.className = 'legend';
        legend.innerHTML = `
            <strong style="display:block;margin-bottom:6px;">Pricing Legend</strong>
            <div><span class="legend-dot" style="background:#22c55e"></span> Affordable (&lt;1Cr)</div>
            <div><span class="legend-dot" style="background:#f97316"></span> Moderate (1Cr–3Cr)</div>
            <div><span class="legend-dot" style="background:#ef4444"></span> Expensive (&gt;3Cr)</div>
        `;
        map.controls[google.maps.ControlPosition.BOTTOM_RIGHT].push(legend);

        const fmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        const infoWindow = new google.maps.InfoWindow();

        fetch('/api/price-heatmap')
            .then(r => r.json())
            .then(locations => {
                const bounds = new google.maps.LatLngBounds();

                locations.forEach(loc => {
                    let color, radius;
                    if (loc.price < 10000000) {
                        color = '#22c55e';
                        radius = Math.max(1500, Math.min(6000, loc.price / 3000));
                    } else if (loc.price <= 30000000) {
                        color = '#f97316';
                        radius = Math.max(1500, Math.min(6000, loc.price / 6000));
                    } else {
                        color = '#ef4444';
                        radius = Math.max(1500, Math.min(6000, loc.price / 12000));
                    }

                    const circle = new google.maps.Circle({
                        map: map,
                        center: { lat: loc.lat, lng: loc.lng },
                        radius: radius,
                        strokeColor: color,
                        strokeOpacity: 0.9,
                        strokeWeight: 1,
                        fillColor: color,
                        fillOpacity: 0.5,
                    });

                    const content = `
                        <div style="color:#0f172a;padding:6px;min-width:160px">
                            <strong style="font-size:13px">${loc.location}</strong><br>
                            <span style="font-size:12px">Avg Price: <strong>${fmt.format(loc.price)}</strong></span>
                        </div>`;

                    circle.addListener('mouseover', function() {
                        infoWindow.setContent(content);
                        infoWindow.setPosition(circle.getCenter());
                        infoWindow.open(map);
                    });

                    circle.addListener('click', function() {
                        infoWindow.setContent(content);
                        infoWindow.setPosition(circle.getCenter());
                        infoWindow.open(map);
                    });

                    bounds.extend({ lat: loc.lat, lng: loc.lng });
                });

                if (locations.length > 0) map.fitBounds(bounds);
            })
            .catch(err => console.error('Heatmap data error:', err));
    }
</script>
<script
    src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&callback=initMap"
    async defer>
</script>
{% endblock %}
