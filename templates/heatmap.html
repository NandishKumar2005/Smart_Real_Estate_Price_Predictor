{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
    #heatmap-container { 
        height: 500px; 
        border-radius: 12px; 
        width: 100%;
        margin-top: 1rem;
    }
    .legend {
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        padding: 10px;
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        color: var(--text-color);
        font-size: 0.9rem;
    }
    .legend i {
        width: 18px;
        height: 18px;
        float: left;
        margin-right: 8px;
        opacity: 0.7;
        border-radius: 50%;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row align-items-center mb-4 fade-in-up">
        <div class="col-12 text-center text-md-start">
            <h2 class="display-6 fw-bold mb-2"><span class="text-gradient"><i class="fa-solid fa-map-location-dot me-3"></i>Real Estate Price Heatmap</span></h2>
            <p class="text-muted">Explore property valuations across different areas. Bubble size and color indicate relative affordability.</p>
        </div>
    </div>

    <div class="row fade-in-up delay-1">
        <div class="col-12">
            <div class="glass-card p-2 p-md-4">
                <div id="heatmap-container"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        // Initialize Map centered on Bangalore
        const map = L.map('heatmap-container').setView([12.9716, 77.5946], 11);
        
        // OpenStreetMap tiles — free, no API key required
        function getTileLayerUrl() {
            return 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        }

        let tileLayer = L.tileLayer(getTileLayerUrl(), {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // No theme-based tile swap needed for OSM (single style)
        window.addEventListener('themeChanged', () => {});

        try {
            // Fetch heatmap data
            const response = await fetch('/api/price-heatmap');
            const locations = await response.json();

            // Find min/max for dynamic scaling if we wanted to, but we'll use fixed thresholds
            // Thresholds:
            // < 75L = Affordable (Green) #22c55e
            // 75L - 1.25Cr = Moderate (Orange) #f97316
            // > 1.25Cr = Expensive (Red) #ef4444

            const bounds = L.latLngBounds();

            locations.forEach(loc => {
                let color, radiusDivisor;

                if (loc.price < 7500000) {
                    color = '#22c55e'; // Green
                    radiusDivisor = 100000;
                } else if (loc.price <= 12500000) {
                    color = '#f97316'; // Orange
                    radiusDivisor = 80000;
                } else {
                    color = '#ef4444'; // Red
                    radiusDivisor = 60000;
                }

                // Calculate a reasonable radius based on price
                const radius = Math.max(300, Math.min(1500, loc.price / radiusDivisor));

                L.circle([loc.lat, loc.lng], {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.5,
                    radius: radius,
                    weight: 1
                }).addTo(map)
                  .bindPopup(`
                    <div class="text-dark p-1">
                        <strong class="d-block mb-1">${loc.location}</strong>
                        <span class="text-muted">Avg Price:</span> 
                        <strong>${new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(loc.price)}</strong>
                    </div>
                  `);
                  
                // Add node to bounds
                bounds.extend([loc.lat, loc.lng]);
            });

            // Adjust map view to fit all markers natively!
            if (locations.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }

            // Add legend
            const legend = L.control({position: 'bottomright'});
            legend.onAdd = function (map) {
                const div = L.DomUtil.create('div', 'legend');
                div.innerHTML += '<strong>Pricing Legend</strong><br><br>';
                div.innerHTML += '<i style="background: #22c55e"></i> Affordable (&lt;75L)<br>';
                div.innerHTML += '<i style="background: #f97316"></i> Moderate (75L - 1.25Cr)<br>';
                div.innerHTML += '<i style="background: #ef4444"></i> Expensive (&gt;1.25Cr)<br>';
                return div;
            };
            legend.addTo(map);

        } catch (error) {
            console.error('Error fetching heatmap data:', error);
        }
    });
</script>
{% endblock %}
