{% extends 'base.html' %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center fade-in-up">
            <h2 class="fw-bold mb-4">Create Account</h2>
            <div class="glass-card p-4 p-md-5 text-start">

                <!-- Google Sign-Up -->
                <a href="{% url 'google-oauth-init' %}" class="btn btn-light w-100 rounded-pill mb-3 d-flex align-items-center justify-content-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.15 0 5.64 1.08 7.75 2.85l5.77-5.77C33.91 3.48 29.27 1.5 24 1.5 14.82 1.5 7.08 7.08 3.88 14.94l6.73 5.23C12.21 14.09 17.62 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.1 24.55c0-1.64-.15-3.22-.42-4.75H24v9h12.42c-.54 2.88-2.18 5.32-4.64 6.96l7.18 5.58C43.18 37.02 46.1 31.26 46.1 24.55z"/>
                        <path fill="#FBBC05" d="M10.61 28.63A14.6 14.6 0 0 1 9.5 24c0-1.62.28-3.19.77-4.63l-6.73-5.23A22.44 22.44 0 0 0 1.5 24c0 3.61.86 7.03 2.38 10.06l6.73-5.43z"/>
                        <path fill="#34A853" d="M24 46.5c5.27 0 9.7-1.74 12.93-4.72l-7.18-5.58c-1.8 1.21-4.1 1.93-5.75 1.93-6.38 0-11.79-4.59-13.39-10.68l-6.73 5.43C7.08 40.92 14.82 46.5 24 46.5z"/>
                        <path fill="none" d="M1.5 1.5h45v45h-45z"/>
                    </svg>
                    Sign up with Google
                </a>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1 border-secondary">
                    <span class="mx-2 text-muted small">or</span>
                    <hr class="flex-grow-1 border-secondary">
                </div>

                <form method="POST" action="{% url 'register' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill mb-3">Register</button>
                    <div class="text-center mt-3">
                        <small class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none">Login</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
